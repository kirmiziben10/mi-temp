<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f5" />
    <meta
      name="description"
      content="Connect to your Xiaomi Mi Temperature and Humidity Monitor 2 via Bluetooth: live readings, on-device history and bind key."
    />
    <title>Mi Temperature Monitor</title>

    <!-- Apply the theme before first paint to prevent a flash. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('miTempTheme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
      // Enable transitions only after load.
      window.addEventListener('load', function () {
        document.documentElement.classList.add('loaded');
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
